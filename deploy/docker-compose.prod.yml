# =============================================================================
# CryptoNotes Production Docker Compose
#
# Includes Caddy reverse proxy for automatic HTTPS via Let's Encrypt
#
# Usage:
#   1. Copy this file and .env.example to your server
#   2. cp .env.example .env && nano .env  (set your values)
#   3. docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.8"

services:
  # --------------------------------------------------------------------------
  # Caddy - Automatic HTTPS reverse proxy
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: cryptonotes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
      - HTTPS_PORT=${HTTPS_PORT:-443}
    networks:
      - frontend
    depends_on:
      - cryptonotes
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # CryptoNotes Server
  # --------------------------------------------------------------------------
  cryptonotes:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cryptonotes-server
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - cryptonotes-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Security__TokenSigningKey=${TOKEN_SIGNING_KEY:?Set TOKEN_SIGNING_KEY in .env}
      - Security__TokenExpiryHours=${TOKEN_EXPIRY_HOURS:-24}
      - Security__MaxLoginAttemptsPerMinute=${MAX_LOGIN_ATTEMPTS:-5}
      - Security__MaxMessageSizeBytes=${MAX_MESSAGE_SIZE:-65536}
      - Security__MinPasswordLength=${MIN_PASSWORD_LENGTH:-8}
      - Security__MessageExpiryDays=${MESSAGE_EXPIRY_DAYS:-30}
      - Admin__AllowedIPs=${ADMIN_ALLOWED_IPS:-}
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 256M
        reservations:
          memory: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Automatic backups (runs daily)
  # --------------------------------------------------------------------------
  backup:
    image: alpine:3.18
    container_name: cryptonotes-backup
    restart: unless-stopped
    volumes:
      - cryptonotes-data:/data:ro
      - cryptonotes-backups:/backups
    entrypoint: /bin/sh
    command: >
      -c 'while true; do
        TIMESTAMP=$$(date +%Y%m%d-%H%M%S);
        if [ -f /data/cryptonotes.db ]; then
          cp /data/cryptonotes.db "/backups/cryptonotes-$$TIMESTAMP.db";
          echo "[$$TIMESTAMP] Backup created";
          ls -t /backups/cryptonotes-*.db 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null;
        fi;
        sleep 86400;
      done'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: []

volumes:
  cryptonotes-data:
  cryptonotes-backups:
  caddy-data:
  caddy-config:

networks:
  frontend:
    driver: bridge
